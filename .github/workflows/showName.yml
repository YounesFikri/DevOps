name: CI

on:
  push:
    branches: [ "page" ]
  pull_request:
    branches: [ "page" ]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .   # folder containing your index.html

      - id: deployment
        uses: actions/deploy-pages@v4
